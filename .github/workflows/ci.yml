name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # The repository layer runs its SQL against Node's built-in SQLite rather
      # than expo-sqlite, which cannot load here — see test-utils/.
      - name: Test
        run: npm test

      # Catches a bundle that no longer builds, which the unit tests would not.
      - name: Bundle
        run: npx expo export --platform android
